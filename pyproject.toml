[project]
name = "ha-translink"
version = "2026.10.4"
description = "Translink Queensland Home Assistant custom integration"
readme = "README.md"
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "codespell>=2.3.0",
    "pydantic>=2.0.0",
    "pyright>=1.1.390",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=82.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["custom_components*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
	"--cov=custom_components.translink",
	"--cov-branch",
	"--cov-report=term-missing",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "TRY", "RUF", "DTZ", "PYI"]
ignore = ["E501", "S101", "TRY003", "TRY300"]

[tool.ruff.lint.per-file-ignores]
"custom_components/translink/const.py" = ["S105"]
"tests/*" = ["RUF012", "DTZ011", "PYI034", "S101", "S105", "S106", "TRY003"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", ".local", "build"]
skips = ["B101"]
